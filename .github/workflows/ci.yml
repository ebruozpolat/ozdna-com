# Content-provenance MVP (app/) — batch gate per plan/09-DEV-SETUP.md §9.
# Never deploys. No Cloudflare secrets in GitHub.
name: ci

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Batch gate (typecheck + biome + vitest)
        run: npm run check

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Forge test
        run: forge test -vv
