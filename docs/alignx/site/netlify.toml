# Netlify config for the ozDNA AI-oversight site (an AlignX Partners product).
# Read when the Netlify site's base directory = docs/alignx/site.
# Deploy target: https://alignxpartners.com (domain root). Static, no build step.

[build]
  publish = "."

# Canonicalize scheme + host to https://alignxpartners.com
[[redirects]]
  from = "http://alignxpartners.com/*"
  to = "https://alignxpartners.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.alignxpartners.com/*"
  to = "https://www.alignxpartners.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alignxpartners.com/*"
  to = "https://alignxpartners.com/:splat"
  status = 301
  force = true

# /tr -> /tr/ (trailing slash)
[[redirects]]
  from = "/tr"
  to = "/tr/"
  status = 301

# Netlify serves /404.html automatically for unmatched paths (no catch-all needed).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
